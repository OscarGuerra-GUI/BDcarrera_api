<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de importación Excel</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .contenedor {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
        }

        input,
        button {
            margin-top: 15px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        pre {
            margin-top: 25px;
            background: #111;
            color: #eee;
            padding: 15px;
            overflow-x: auto;
            white-space: pre-wrap;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>Prueba de lectura de Excel</h1>

    <p>
        Selecciona el archivo descargado de Microsoft Forms.
        Esta prueba solamente leerá el archivo y mostrará el JSON.
        No insertará datos en MySQL.
    </p>

    <div class="contenedor">

        <input
            type="file"
            id="archivo"
            accept=".xlsx,.xls"
        >

        <br>

        <button id="btnEnviar">
            Probar lectura
        </button>

    </div>

    <pre id="resultado">
Aquí aparecerá el resultado...
    </pre>


<script>

const boton = document.getElementById("btnEnviar");
const inputArchivo = document.getElementById("archivo");
const resultado = document.getElementById("resultado");

boton.addEventListener("click", async () => {

    if (!inputArchivo.files.length) {
        resultado.textContent =
            "Selecciona primero un archivo Excel.";
        return;
    }

    const archivo = inputArchivo.files[0];

    const formData = new FormData();

    formData.append("archivo", archivo);

    resultado.textContent =
        "Leyendo archivo, espera...";

    try {

        const respuesta = await fetch(
            "../api/importacion/probar_excel.php",
            {
                method: "POST",
                body: formData
            }
        );

        const texto = await respuesta.text();

        try {

            const json = JSON.parse(texto);

            resultado.textContent =
                JSON.stringify(json, null, 4);

        } catch {

            resultado.textContent =
                "La respuesta no fue JSON:\n\n" + texto;
        }

    } catch (error) {

        resultado.textContent =
            "Error al enviar el archivo:\n" +
            error.message;
    }

});

</script>

</body>
</html>
